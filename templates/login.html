<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        Login · {{ salao.nome }}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="pagina-login">


    <main class="login">


        <a
            class="logo login-logo"
            href="{{ url_for('home') }}"
        >

            <span>
                {{ salao.nome }}
            </span>

            <small>
                Área administrativa
            </small>

        </a>


        <section class="login-card">


            <p class="eyebrow">
                Acesso restrito
            </p>


            <h1>
                Entrar
            </h1>


            {% if desativado %}


                <div class="alerta erro">

                    O acesso administrativo
                    não está configurado.

                    Verifique o arquivo
                    de segredos do projeto.

                </div>


            {% else %}


                {% if erro %}


                    <div
                        class="alerta erro"
                        role="alert"
                    >
                        {{ erro }}
                    </div>


                {% endif %}


                <form
                    method="post"
                    action="{{ url_for('admin_login') }}"
                >


                    <input
                        type="hidden"

                        name="csrf_token"

                        value="{{ csrf_token() }}"
                    >


                    <label for="senha">
                        Senha
                    </label>


                    <input
                        id="senha"

                        name="senha"

                        type="password"

                        autocomplete="current-password"

                        required
                    >


                    <button
                        class="btn"
                        type="submit"
                    >
                        Entrar
                    </button>


                </form>


            {% endif %}


            <a
                class="voltar"
                href="{{ url_for('home') }}"
            >
                ← Voltar para o site
            </a>


        </section>


    </main>


</body>

</html>
